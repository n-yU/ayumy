[tool.pytest.ini_options]
pythonpath = ["lambda"]

[tool.coverage.run]
source = ["lambda"]
data_file = "tests/.coverage"

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "tests/coverage-python.xml"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is enforced by the formatter; lint should not flag strings the formatter cannot wrap.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "report"]
