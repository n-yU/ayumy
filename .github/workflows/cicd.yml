name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r lambda/requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check --diff lambda tests

      - name: Lint
        run: python -m ruff check lambda tests

      - name: Run Python tests
        run: python -m pytest tests/python/ -v

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run shell tests
        run: bats tests/shell/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cd-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Build
        run: sam build

      - name: Deploy
        run: >
          sam deploy
          --stack-name ayumy
          --capabilities CAPABILITY_IAM
          --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }}
          --s3-prefix ayumy
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides NotionDatabaseId=${{ secrets.NOTION_DATABASE_ID }}
