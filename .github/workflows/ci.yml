name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned because Ubuntu 24.04 (noble) removed kcov from universe; 22.04 still ships it.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # Codecov authenticates uploads through GitHub OIDC instead of a stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.12"

      - name: Verify requirements lock is in sync with .in sources
        run: |
          make lock
          git diff --exit-code lambda/requirements.txt lambda/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r lambda/requirements-dev.txt

      # pytest runs directly below, bypassing the Makefile prerequisite that generates config.yml.
      - name: Generate config from template
        run: make config-init

      - name: Check formatting
        run: python -m ruff format --check --diff lambda tests docs/assets/arch

      - name: Lint
        run: python -m ruff check lambda tests docs/assets/arch

      - name: Type check
        run: python -m mypy

      - name: Run Python tests with coverage
        run: |
          python -m pytest tests/python/ -v \
            --cov=lambda --cov-report=term-missing --cov-report=xml

      - name: Install bats and kcov
        run: sudo apt-get update && sudo apt-get install -y bats kcov

      - name: Run shell tests with coverage
        run: |
          mkdir -p tests/coverage-shell
          kcov --include-path=scripts,hooks,bin \
            --bash-parse-files-in-dir=scripts,hooks,bin \
            tests/coverage-shell bats tests/shell/

      - name: Report coverage summary
        if: always()
        run: bash .github/scripts/coverage_summary.sh

      - name: Note partial coverage on test failure
        if: failure()
        run: echo "_Coverage values may be partial when tests fail._" >> "$GITHUB_STEP_SUMMARY"

      # The upload steps below run only when every test passed, so partial coverage never reaches Codecov.
      - name: Locate shell coverage report
        id: shell-report
        run: |
          # kcov suffixes its output directory with a hash, so the path cannot be written statically.
          report=$(find tests/coverage-shell -name cobertura.xml -path '*bats*' | head -1)
          test -n "$report"
          echo "path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: tests/coverage-python.xml
          disable_search: true
          flags: python
          fail_ci_if_error: true

      - name: Upload shell coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ steps.shell-report.outputs.path }}
          disable_search: true
          flags: shell
          fail_ci_if_error: true
