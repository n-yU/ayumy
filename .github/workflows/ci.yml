name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned because Ubuntu 24.04 (noble) removed kcov from universe; 22.04 still ships it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"

      - name: Verify requirements lock is in sync with .in sources
        run: |
          make lock
          git diff --exit-code lambda/requirements.txt lambda/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r lambda/requirements-dev.txt

      # pytest runs directly below, bypassing the Makefile prerequisite that generates config.yml.
      - name: Generate config from template
        run: make config-init

      - name: Check formatting
        run: python -m ruff format --check --diff lambda tests

      - name: Lint
        run: python -m ruff check lambda tests

      - name: Type check
        run: python -m mypy

      - name: Run Python tests with coverage
        run: |
          python -m pytest tests/python/ -v \
            --cov=lambda --cov-report=term-missing --cov-report=xml

      - name: Install bats and kcov
        run: sudo apt-get update && sudo apt-get install -y bats kcov

      - name: Run shell tests with coverage
        run: |
          mkdir -p tests/coverage-shell
          kcov --include-path=scripts,hooks,bin \
            --bash-parse-files-in-dir=scripts,hooks,bin \
            tests/coverage-shell bats tests/shell/

      - name: Report coverage summary
        if: always()
        run: bash .github/scripts/coverage_summary.sh

      - name: Note partial coverage on test failure
        if: failure()
        run: echo "_Coverage values may be partial when tests fail._" >> "$GITHUB_STEP_SUMMARY"
