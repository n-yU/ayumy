AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ayumy - Daily development activity reporter

Parameters:
  NotionDatabaseId:
    Type: String
    Description: Notion database ID for daily reports
  SlackChannelId:
    Type: String
    Description: Slack channel ID for notifications (e.g. C0XXXXXXXXX or G0XXXXXXXXX)
  LambdaTimeoutSeconds:
    Type: Number
    Default: 300
    Description: Lambda function timeout in seconds
  SlackWorkspaceId:
    Type: String
    Description: Slack workspace ID copied from the Amazon Q Developer in chat applications console
  SessionBucketNameOverride:
    Type: String
    Default: ""
    Description: S3 bucket name for session logs (leave empty to create one in the account regional namespace)

Conditions:
  HasSessionBucketNameOverride: !Not [!Equals [!Ref SessionBucketNameOverride, ""]]

Globals:
  Function:
    Timeout: !Ref LambdaTimeoutSeconds
    MemorySize: 512
    Runtime: python3.12

Resources:
  # DynamoDB table for session metadata
  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ayumy-sessions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: "repo#session_id"
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: "repo#session_id"
          KeyType: RANGE

  # DynamoDB table for per-execution Claude API cost log
  CostTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ayumy-costs
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: year_month
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: year_month
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # S3 bucket for session log storage
  SessionBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Changing any of these three on a deployed stack replaces the bucket
      BucketName: !If [HasSessionBucketNameOverride, !Ref SessionBucketNameOverride, !Ref AWS::NoValue]
      # The account regional namespace keeps other accounts from claiming the name after deletion
      BucketNamePrefix: !If [HasSessionBucketNameOverride, !Ref AWS::NoValue, ayumy]
      BucketNamespace: !If [HasSessionBucketNameOverride, !Ref AWS::NoValue, account-regional]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Lambda function for report generation
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ayumy-report
      Handler: handler.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          AYUMY_S3_BUCKET: !Ref SessionBucket
          AYUMY_DYNAMO_TABLE: !Ref SessionTable
          AYUMY_COST_TABLE: !Ref CostTable
          AYUMY_LAMBDA_TIMEOUT: !Ref LambdaTimeoutSeconds
          NOTION_DATABASE_ID: !Ref NotionDatabaseId
          SLACK_CHANNEL: !Ref SlackChannelId
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SessionBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CostTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ayumy/*"
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            Name: ayumy-daily-report
            ScheduleExpression: cron(0 15 * * ? *)
            ScheduleExpressionTimezone: UTC
            State: ENABLED
            Description: Run daily at JST 00:00 (UTC 15:00)

  # SNS topic for alarms on failures the function cannot report itself
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ayumy-alarms

  # Pipeline failures return 500, leaving Errors for secret retrieval and runtime terminations
  ReportFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ayumy-report-errors
      AlarmDescription: Report function terminated before it could notify Slack
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReportFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmTopic

  AlarmChatbotRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: chatbot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess

  AlarmSlackChannel:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: ayumy-alarms
      IamRoleArn: !GetAtt AlarmChatbotRole.Arn
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SlackChannelId: !Ref SlackChannelId
      SnsTopicArns:
        - !Ref AlarmTopic
      # Default guardrail is AdministratorAccess, so it is narrowed to match what the role already allows
      GuardrailPolicies:
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess

Outputs:
  ReportFunctionName:
    Description: Lambda function name (set as AYUMY_LAMBDA_FUNCTION on client)
    Value: !Ref ReportFunction
  SessionBucketName:
    Description: S3 bucket name (set as AYUMY_S3_BUCKET on client)
    Value: !Ref SessionBucket
  SessionTableName:
    Description: DynamoDB table name for session metadata
    Value: !Ref SessionTable
  CostTableName:
    Description: DynamoDB table name for per-execution Claude API cost log
    Value: !Ref CostTable
