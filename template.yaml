AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ayumy - Daily development activity reporter

Parameters:
  NotionDatabaseId:
    Type: String
    Description: Notion database ID for daily reports
  SlackChannelId:
    Type: String
    Description: Slack channel ID for notifications (e.g. C0XXXXXXXXX or G0XXXXXXXXX)
  LambdaTimeoutSeconds:
    Type: Number
    Default: 300
    Description: Lambda function timeout in seconds

Globals:
  Function:
    Timeout: !Ref LambdaTimeoutSeconds
    MemorySize: 512
    Runtime: python3.12

Resources:
  # DynamoDB table for session metadata
  SessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ayumy-sessions
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: "repo#session_id"
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: "repo#session_id"
          KeyType: RANGE

  # DynamoDB table for per-execution Claude API cost log
  CostTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ayumy-costs
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: year_month
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: year_month
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # S3 bucket for session log storage
  SessionBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ayumy.n-yu
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Lambda function for report generation
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ayumy-report
      Handler: handler.lambda_handler
      CodeUri: lambda/
      Environment:
        Variables:
          AYUMY_S3_BUCKET: !Ref SessionBucket
          AYUMY_DYNAMO_TABLE: !Ref SessionTable
          AYUMY_COST_TABLE: !Ref CostTable
          AYUMY_LAMBDA_TIMEOUT: !Ref LambdaTimeoutSeconds
          NOTION_DATABASE_ID: !Ref NotionDatabaseId
          SLACK_CHANNEL: !Ref SlackChannelId
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref SessionBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CostTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ayumy/*"
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            Name: ayumy-daily-report
            ScheduleExpression: cron(0 15 * * ? *)
            ScheduleExpressionTimezone: UTC
            State: ENABLED
            Description: Run daily at JST 00:00 (UTC 15:00)

Outputs:
  ReportFunctionName:
    Description: Lambda function name (set as AYUMY_LAMBDA_FUNCTION on client)
    Value: !Ref ReportFunction
  SessionBucketName:
    Description: S3 bucket name (set as AYUMY_S3_BUCKET on client)
    Value: !Ref SessionBucket
  SessionTableName:
    Description: DynamoDB table name for session metadata
    Value: !Ref SessionTable
  CostTableName:
    Description: DynamoDB table name for per-execution Claude API cost log
    Value: !Ref CostTable
